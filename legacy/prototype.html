function openSheet(){const existing=document.getElementById('newSheet');if(existing)return;const overlay=document.createElement('div');overlay.className='overlay';overlay.id='newSheet';overlay.innerHTML=`<div class="sheet"><div class="sheet-grab"></div><h2>What would you like to make?</h2><p>Pick a starting point. You can switch tools any time.</p><div class="sheet-tools">${toolList.filter(t=>t.id!=='library').map(t=>`<button class="sheet-tool" data-open-tool="${t.id}"><span class="tool-icon ${t.color}">${icon(t.icon)}</span>${t.name}</button>`).join('')}</div><div class="button-row"><button class="soft-button" data-action="closeSheet">Not sure yet</button></div></div>`;document.getElementById('device').appendChild(overlay);overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()})}

function photoWorkspace(){return `<p class="screen-desc">Make your photos feel like you. Start with a picture, then try a few gentle adjustments.</p><section class="workspace-card"><div id="photoUploadArea" class="drop-zone"><div class="upload-mark">▧</div><strong>Choose a photo to begin</strong><p>Your image stays on this device in this prototype. JPG, PNG or WebP works best.</p><label class="soft-button dark">Choose photo<input id="photoInput" type="file" accept="image/*" hidden></label></div><div id="photoEditor" class="hidden"><div class="photo-canvas-wrap"><canvas id="photoCanvas" class="photo-canvas"></canvas></div><div class="hr"></div><p class="control-title">Adjust your image</p>${[['brightness','Brightness'],['contrast','Contrast'],['saturation','Color']].map(([id,label])=>`<div class="slider-row"><label for="${id}">${label}</label><input class="photo-range" id="${id}" type="range" min="50" max="160" value="100" data-adjust="${id}"><output id="${id}Value">100%</output></div>`).join('')}<div class="button-row"><button class="soft-button" data-action="resetPhoto">Reset</button><button class="soft-button lime" data-action="exportPhoto">Download PNG</button></div><div class="button-row"><button class="soft-button dark" data-action="savePhoto">Save to projects</button><label class="soft-button">Change photo<input id="photoInput2" type="file" accept="image/*" hidden></label></div></div></section><p class="hint">Tip: Small changes often look best. Try moving one slider at a time.</p></main>`}
function drawWorkspace(){return `<p class="screen-desc">A blank canvas, a few simple tools, and room to experiment. Draw with your finger or a stylus.</p><section class="workspace-card"><div class="draw-toolbar"><button class="draw-tool active" data-draw-mode="pen">✎ Pen</button><button class="draw-tool" data-draw-mode="circle">○ Circle</button><button class="draw-tool" data-draw-mode="square">▢ Shape</button><button class="soft-button" data-action="undoDraw" style="margin-left:auto;min-height:31px;padding:0 10px">Undo</button></div><div class="draw-toolbar" style="align-items:center"><span class="hint" style="margin:0 2px 0 0">Color</span>${['#263229','#ee8066','#568ac6','#7e62bf','#e0ae39','#222222'].map((c,i)=>`<button class="color-dot ${i===0?'active':''}" style="background:${c}" data-color="${c}" aria-label="Select color"></button>`).join('')}<button class="soft-button danger" data-action="clearDraw" style="margin-left:auto;min-height:31px;padding:0 10px">Clear</button></div><div class="canvas-wrap"><canvas id="drawCanvas" class="drawing-canvas" width="960" height="720" aria-label="Drawing canvas"></canvas></div><div class="field-row" style="margin-top:12px"><div><label class="input-label" for="drawText">Add a little text</label><input class="text-input" id="drawText" maxlength="36" placeholder="Hello, world!"></div><div style="display:flex;align-items:end"><button class="soft-button" style="width:100%" data-action="addDrawText">Add text</button></div></div><div class="button-row"><button class="soft-button dark" data-action="saveDraw">Save to projects</button><button class="soft-button lime" data-action="exportDraw">Download image</button></div></section><p class="hint">Your canvas is 4:3. Pinch-free, simple drawing tools make it easy to start.</p></main>`}
function videoWorkspace(){return `<p class="screen-desc">Bring in a clip, preview it, and mark the moment you want to keep. This first prototype saves edit notes, not a rendered video.</p><section class="workspace-card"><div id="videoUploadArea" class="drop-zone"><div class="upload-mark">▶</div><strong>Choose a video clip</strong><p>Pick a video from your device to preview it here.</p><label class="soft-button dark">Choose video<input id="videoInput" type="file" accept="video/*" hidden></label></div><div id="videoEditor" class="hidden"><div class="video-frame"><video id="videoPlayer" controls playsinline></video></div><div class="trim-row"><label>Playhead</label><input id="videoScrub" type="range" min="0" max="100" value="0"><output id="videoTime">0:00</output></div><div class="field-row"><button class="soft-button" data-action="markIn">Set start here</button><button class="soft-button" data-action="markOut">Set end here</button></div><div class="coming-soon" id="trimInfo">Choose a clip to see its length and mark a section.</div><div class="button-row"><button class="soft-button dark" data-action="saveVideo">Save edit notes</button><label class="soft-button">Choose another<input id="videoInput2" type="file" accept="video/*" hidden></label></div></div></section><p class="hint">Your video is only previewed locally in the browser. Exporting a finished edited video is a later step.</p></main>`}
function pdfWorkspace(){return `<p class="screen-desc">Open a PDF and keep a note about it. Your note is saved in this browser; the original file is not uploaded.</p><section class="workspace-card"><div id="pdfUploadArea" class="pdf-empty"><div><div class="pdf-icon">▤</div><strong>Open a PDF to get started</strong><p>Choose a file from your device. For this prototype, PDF reading depends on your browser’s built-in viewer.</p><label class="soft-button dark">Choose PDF<input id="pdfInput" type="file" accept="application/pdf,.pdf" hidden></label></div></div><div id="pdfReader" class="hidden"><div class="badge" style="margin-bottom:10px"><span class="badge-dot"></span><span id="pdfFileName">PDF</span></div><iframe id="pdfFrame" class="pdf-frame" title="PDF preview"></iframe><div class="hr"></div><label class="input-label" for="pdfNotes">My notes</label><textarea class="text-area" id="pdfNotes" placeholder="Add a reminder or a thought about this PDF..."></textarea><div class="button-row"><button class="soft-button dark" data-action="savePdf">Save notes</button><label class="soft-button">Open another<input id="pdfInput2" type="file" accept="application/pdf,.pdf" hidden></label></div></div></section><p class="hint">This starter version reads a single PDF at a time. Combining and rearranging pages can be added in a later build.</p></main>`}
function motionWorkspace(){return `<p class="screen-desc">Type a message and watch it move. A tiny first step toward animated titles and motion graphics.</p><section class="workspace-card"><div class="preview-label">Live preview</div><div class="workspace-stage"><div class="motion-stage" id="motionStage"><div class="motion-text ${esc(motionSettings.animation)}" id="motionTitle" style="color:${esc(motionSettings.color)}">${esc(motionSettings.text)}</div></div></div><div class="hr"></div><label class="input-label" for="motionInput">Your message</label><input class="text-input" id="motionInput" maxlength="48" value="${esc(motionSettings.text)}" placeholder="Write a few words"><div class="field-row" style="margin-top:11px"><div><label class="input-label" for="motionAnimation">Movement</label><select class="select-input" id="motionAnimation"><option value="floaty" ${motionSettings.animation==='floaty'?'selected':''}>Float</option><option value="pulse" ${motionSettings.animation==='pulse'?'selected':''}>Pulse</option><option value="slide" ${motionSettings.animation==='slide'?'selected':''}>Slide</option><option value="bounce" ${motionSettings.animation==='bounce'?'selected':''}>Bounce</option><option value="still" ${motionSettings.animation==='still'?'selected':''}>No movement</option></select></div><div><label class="input-label" for="motionColor">Text color</label><select class="select-input" id="motionColor"><option value="#d7f77b">Soft lime</option><option value="#ffb598">Peach</option><option value="#c6b7ff">Lavender</option><option value="#ffffff">White</option></select></div></div><div class="button-row"><button class="soft-button dark" data-action="saveMotion">Save project</button><button class="soft-button lime" data-action="exportMotion">Download preview</button></div></section><p class="hint">Download creates a small animated HTML preview you can open in a browser. It is not a video file yet.</p></main>`}
function makeLayoutSvg(){const bg=layoutSettings.background;return `<svg id="layoutSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-label="Poster preview"><rect width="720" height="900" fill="${escXml(bg)}"/><circle cx="605" cy="115" r="140" fill="${escXml(layoutSettings.accent)}" opacity=".7"/><circle cx="92" cy="792" r="188" fill="#c5d6a5" opacity=".65"/><path d="M0 0h720v230c-114 75-232 89-360 62C207 265 93 211 0 260Z" fill="#fff" opacity=".38"/><text x="64" y="390" font-family="system-ui,sans-serif" font-size="55" font-weight="800" letter-spacing="-2" fill="#1d241d">${escXml(layoutSettings.title.split('\n')[0]||'')}</text>${layoutSettings.title.split('\n').slice(1).map((line,i)=>`<text x="64" y="${455+i*65}" font-family="system-ui,sans-serif" font-size="55" font-weight="800" letter-spacing="-2" fill="#1d241d">${escXml(line)}</text>`).join('')}<text x="67" y="690" font-family="system-ui,sans-serif" font-size="23" fill="#4e5948">${escXml(layoutSettings.subtitle)}</text><rect x="64" y="744" width="82" height="8" rx="4" fill="${escXml(layoutSettings.accent)}"/><text x="64" y="815" font-family="system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#6c7565">MADE WITH MOSAIC</text></svg>`}
function layoutWorkspace(){return `<p class="screen-desc">Create a simple poster or social card. Change the words and colors, then save your design.</p><section class="workspace-card"><div class="preview-label">Your design</div><div class="layout-preview" id="layoutPreview">${makeLayoutSvg()}</div><div class="hr"></div><label class="input-label" for="layoutTitle">Headline</label><textarea class="text-area" id="layoutTitle" maxlength="100">${esc(layoutSettings.title)}</textarea><label class="input-label" for="layoutSubtitle" style="margin-top:11px">Small caption</label><input class="text-input" id="layoutSubtitle" maxlength="70" value="${esc(layoutSettings.subtitle)}"><div class="field-row" style="margin-top:11px"><div><label class="input-label" for="layoutBackground">Page color</label><select class="select-input" id="layoutBackground"><option value="#f2ecdf">Warm paper</option><option value="#f1ead6">Oat</option><option value="#e4edf1">Cool sky</option><option value="#f4e1df">Blush</option><option value="#e4e9db">Sage</option></select></div><div><label class="input-label" for="layoutAccent">Accent color</label><select class="select-input" id="layoutAccent"><option value="#f0a78a">Peach</option><option value="#a2c96a">Leaf</option><option value="#95bce0">Blue</option><option value="#b4a0e8">Lavender</option><option value="#e1bd61">Gold</option></select></div></div><div class="button-row"><button class="soft-button dark" data-action="saveLayout">Save project</button><button class="soft-button lime" data-action="exportLayout">Download design</button></div></section><p class="hint">This is a starter page-design tool. More text styles, images, and page sizes can be added next.</p></main>`}
function libraryWorkspace(){return `<p class="screen-desc">Your projects stay on this device in this browser. This first version saves project names and edit notes.</p>${projects.length?`<div class="project-list">${projects.map(projectRow).join('')}</div>`:`<section class="workspace-card library-empty"><div class="big">✦</div><h3>Nothing here yet</h3><p>Make a photo edit, drawing, poster or another little project. Then save it here.</p><button class="primary-button" data-action="new">Choose a tool&nbsp; ↗</button></section>`}<p class="legal-line">Saved only in this browser · Prototype</p></main>`}
function learnWorkspace(){return `<p class="screen-desc">You don’t need to know everything before you start. Try one small thing and build from there.</p><div class="tips-grid"><article class="tip-card"><span class="n">01</span><div><strong>Start with something you already have</strong><p>Choose a photo, a short video, or a few words you like. You can always change it later.</p></div></article><article class="tip-card"><span class="n">02</span><div><strong>Make one change at a time</strong><p>Try one photo adjustment or add one shape. Small experiments are easier to learn from.</p></div></article><article class="tip-card"><span class="n">03</span><div><strong>Save as you go</strong><p>Use “Save to projects” to keep a note in My projects. Your files stay on your device in this prototype.</p></div></article></div><section class="helper-card" style="margin-top:18px"><div class="helper-icon">✦</div><div><strong>You can learn as you make</strong><p>Pick a tool below and we’ll take it one step at a time.</p></div></section><div class="button-row"><button class="soft-button dark" data-action="new">Choose my first tool</button></div></main>`}
function openTool(id){document.getElementById('newSheet')?.remove();if(id==='library'){renderLibrary();return}if(id==='learn'){renderLearn();return}const t=toolList.find(x=>x.id===id);if(!t)return;let content='';switch(id){case'photo':content=photoWorkspace();break;case'draw':content=drawWorkspace();break;case'video':content=videoWorkspace();break;case'pdf':content=pdfWorkspace();break;case'motion':content=motionWorkspace();break;case'layout':content=layoutWorkspace();break;}app.innerHTML=commonTop(t.name,id)+content+nav('');if(id==='draw')initDrawCanvas();if(id==='motion')applyMotion();if(id==='layout')setLayoutSelects();}
function renderLibrary(){app.innerHTML=commonTop('My projects','library')+libraryWorkspace()+nav('projects')}
function renderLearn(){app.innerHTML=commonTop('A gentle start','learn')+learnWorkspace()+nav('learn')}
function renderAllTools(){app.innerHTML=commonTop('All creative tools','library')+`<p class="screen-desc">Choose any tool. We can grow this little studio one useful feature at a time.</p><section class="tool-grid">${toolList.map(toolCard).join('')}</section><div class="coming-soon">You don’t need to decide the whole app today. Start with one tool you’re excited about.</div></main>${nav('')}`}
function initDrawCanvas(){drawCanvas=document.getElementById('drawCanvas');if(!drawCanvas)return;drawCtx=drawCanvas.getContext('2d');drawCtx.fillStyle='#ffffff';drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height);drawCtx.lineCap='round';drawCtx.lineJoin='round';drawCtx.lineWidth=9;drawUndo=[];drawColor='#263229';drawMode='pen';const pos=e=>{const r=drawCanvas.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*drawCanvas.width,y:(e.clientY-r.top)/r.height*drawCanvas.height}};drawCanvas.onpointerdown=e=>{e.preventDefault();drawCanvas.setPointerCapture(e.pointerId);drawing=true;drawStart=pos(e);drawSnapshot=drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height);drawUndo.push(drawSnapshot);if(drawUndo.length>12)drawUndo.shift();if(drawMode==='pen'){drawCtx.beginPath();drawCtx.moveTo(drawStart.x,drawStart.y);drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=9}};drawCanvas.onpointermove=e=>{if(!drawing)return;const p=pos(e);if(drawMode==='pen'){drawCtx.lineTo(p.x,p.y);drawCtx.stroke()}else{drawCtx.putImageData(drawSnapshot,0,0);drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=8;if(drawMode==='circle'){drawCtx.beginPath();drawCtx.ellipse((drawStart.x+p.x)/2,(drawStart.y+p.y)/2,Math.max(2,Math.abs(p.x-drawStart.x)/2),Math.max(2,Math.abs(p.y-drawStart.y)/2),0,0,Math.PI*2);drawCtx.stroke()}else{drawCtx.strokeRect(drawStart.x,drawStart.y,p.x-drawStart.x,p.y-drawStart.y)}}};const finish=()=>{drawing=false;drawStart=null};drawCanvas.onpointerup=finish;drawCanvas.onpointercancel=finish;}
function redrawPhoto(){const c=document.getElementById('photoCanvas');if(!c||!activePhoto)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.filter=`brightness(${photoSettings.brightness}%) contrast(${photoSettings.contrast}%) saturate(${photoSettings.saturation}%)`;ctx.drawImage(activePhoto,0,0,c.width,c.height);ctx.filter='none';for(const k of ['brightness','contrast','saturation']){const input=document.getElementById(k);const out=document.getElementById(k+'Value');if(input)input.value=photoSettings[k];if(out)out.textContent=photoSettings[k]+'%'}}
function loadPhoto(file){if(!file||!file.type.startsWith('image/')){showToast('Please choose an image file');return}const img=new Image();img.onload=()=>{activePhoto=img;const c=document.getElementById('photoCanvas');if(!c)return;const max=1800,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);document.getElementById('photoUploadArea').classList.add('hidden');document.getElementById('photoEditor').classList.remove('hidden');photoSettings={brightness:100,contrast:100,saturation:100};redrawPhoto();showToast('Photo ready to edit')};img.onerror=()=>showToast('Could not open that image');img.src=URL.createObjectURL(file)}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function downloadDataUrl(dataUrl,name){const a=document.createElement('a');a.href=dataUrl;a.download=name;document.body.appendChild(a);a.click();a.remove()}
function safeName(name){return String(name||'mosaic-project').trim().replace(/[^a-z0-9-_]+/gi,'-').replace(/^-+|-+$/g,'').toLowerCase()||'mosaic-project'}
function applyMotion(){const title=document.getElementById('motionTitle');if(!title)return;title.textContent=motionSettings.text||'Make a little magic.';title.className='motion-text '+motionSettings.animation;title.style.color=motionSettings.color;const stage=document.getElementById('motionStage');if(stage)stage.style.background=`linear-gradient(135deg,${motionSettings.background},#596745)`}
function updateLayout(){const holder=document.getElementById('layoutPreview');if(holder)holder.innerHTML=makeLayoutSvg()}
function setLayoutSelects(){const bg=document.getElementById('layoutBackground'),ac=document.getElementById('layoutAccent');if(bg)bg.value=layoutSettings.background;if(ac)ac.value=layoutSettings.accent}
function formatTime(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
document.getElementById('device').addEventListener('click',e=>{
 const open=e.target.closest('[data-open-tool]');if(open){openTool(open.dataset.openTool);return}
 const mode=e.target.closest('[data-draw-mode]');if(mode){drawMode=mode.dataset.drawMode;app.querySelectorAll('[data-draw-mode]').forEach(x=>x.classList.toggle('active',x===mode));return}
 const color=e.target.closest('[data-color]');if(color){drawColor=color.dataset.color;app.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===color));return}
 const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='home'){renderHome();return}if(a==='install'){if(deferredInstall){deferredInstall.prompt();deferredInstall.userChoice.then(()=>{deferredInstall=null})}else showToast('In Android Chrome, open the menu and choose Install app');return}if(a==='projects'){renderLibrary();return}if(a==='learn'){renderLearn();return}if(a==='new'){openSheet();return}if(a==='closeSheet'){document.getElementById('newSheet')?.remove();return}if(a==='allTools'){renderAllTools();return}
 if(a==='resetPhoto'){photoSettings={brightness:100,contrast:100,saturation:100};redrawPhoto();return}
 if(a==='exportPhoto'){const c=document.getElementById('photoCanvas');if(c){c.toBlob(blob=>blob&&downloadBlob(blob,'mosaic-photo.png'));}return}
 if(a==='savePhoto'){saveProject('photo','Photo edit');return}
 if(a==='undoDraw'){if(drawCtx&&drawUndo.length){drawCtx.putImageData(drawUndo.pop(),0,0)}return}
 if(a==='clearDraw'){if(drawCtx){drawUndo.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));drawCtx.fillStyle='#fff';drawCtx.fillRect(0,0,drawCanvas.width,drawCanvas.height)}return}
 if(a==='addDrawText'){const input=document.getElementById('drawText'),txt=input?.value.trim();if(txt&&drawCtx){drawUndo.push(drawCtx.getImageData(0,0,drawCanvas.width,drawCanvas.height));drawCtx.fillStyle=drawColor;drawCtx.font='bold 52px system-ui, sans-serif';drawCtx.fillText(txt,58,100,830);input.value='';showToast('Text added to canvas')}else showToast('Type a little text first');return}
 if(a==='saveDraw'){saveProject('draw','Untitled drawing');return}
 if(a==='exportDraw'){if(drawCanvas)drawCanvas.toBlob(blob=>blob&&downloadBlob(blob,'mosaic-drawing.png'));return}
 if(a==='markIn'||a==='markOut'){const v=document.getElementById('videoPlayer');if(!v)return;if(a==='markIn')videoIn=v.currentTime;else videoOut=v.currentTime;updateTrimInfo();showToast(a==='markIn'?'Start point marked':'End point marked');return}
 if(a==='saveVideo'){const name=document.getElementById('videoName')?.textContent||'Video edit';saveProject('video',name+' edit');showToast('Edit notes saved — video export comes later');return}
 if(a==='savePdf'){const note=document.getElementById('pdfNotes')?.value||'';try{localStorage.setItem('mosaic-pdf-note',note)}catch(err){}saveProject('pdf','PDF notes');return}
 if(a==='saveMotion'){motionSettings.text=document.getElementById('motionInput')?.value||motionSettings.text;saveProject('motion',motionSettings.text.slice(0,32)||'Motion title');return}
 if(a==='exportMotion'){exportMotion();return}
 if(a==='saveLayout'){layoutSettings.title=document.getElementById('layoutTitle')?.value||layoutSettings.title;saveProject('layout',layoutSettings.title.split('\n')[0]||'Poster design');return}
 if(a==='exportLayout'){exportLayout();return}
 if(a==='saveCurrent'){const kind=b.dataset.kind;if(kind==='photo'&&activePhoto)saveProject('photo','Photo edit');else if(kind==='draw')saveProject('draw','Untitled drawing');else if(kind==='layout')saveProject('layout',layoutSettings.title.split('\n')[0]||'Poster design');else if(kind==='motion')saveProject('motion',motionSettings.text);else showToast('Open a tool to start a project');return}
});
app.addEventListener('change',e=>{
 const id=e.target.id;
 if(id==='photoInput'||id==='photoInput2'){loadPhoto(e.target.files?.[0]);return}
 if(id==='videoInput'||id==='videoInput2'){loadVideo(e.target.files?.[0]);return}

 if(id==='layoutBackground'){layoutSettings.background=e.target.value;updateLayout();return}
 if(id==='layoutAccent'){layoutSettings.accent=e.target.value;updateLayout();return}
});
app.addEventListener('input',e=>{
 const adjust=e.target.dataset.adjust;if(adjust){photoSettings[adjust]=Number(e.target.value);redrawPhoto();return}
 if(e.target.id==='motionInput'){motionSettings.text=e.target.value;applyMotion();return}

 if(e.target.id==='videoScrub'){const v=document.getElementById('videoPlayer');if(v&&v.duration){v.currentTime=(Number(e.target.value)/100)*v.duration;document.getElementById('videoTime').textContent=formatTime(v.currentTime)}return}
});
function loadVideo(file){if(!file||!file.type.startsWith('video/')){showToast('Please choose a video file');return}if(videoObjectUrl)URL.revokeObjectURL(videoObjectUrl);videoObjectUrl=URL.createObjectURL(file);document.getElementById('videoUploadArea').classList.add('hidden');document.getElementById('videoEditor').classList.remove('hidden');const v=document.getElementById('videoPlayer');v.src=videoObjectUrl;v.onloadedmetadata=()=>{const scrub=document.getElementById('videoScrub');scrub.max=100;scrub.value=0;document.getElementById('videoTime').textContent='0:00';videoIn=0;videoOut=v.duration;updateTrimInfo()};v.ontimeupdate=()=>{const scrub=document.getElementById('videoScrub');if(scrub&&v.duration){scrub.value=String(v.currentTime/v.duration*100);document.getElementById('videoTime').textContent=formatTime(v.currentTime)}};showToast('Video ready to preview')}
function updateTrimInfo(){const v=document.getElementById('videoPlayer'),info=document.getElementById('trimInfo');if(!v||!info)return;info.textContent=`Selected section: ${formatTime(videoIn)} to ${formatTime(videoOut??v.duration)} of ${formatTime(v.duration)}. This prototype saves edit notes only.`}
function loadPdf(file){if(!file)return;if(file.type!=='application/pdf'&&!file.name.toLowerCase().endsWith('.pdf')){showToast('Please choose a PDF file');return}if(pdfObjectUrl)URL.revokeObjectURL(pdfObjectUrl);pdfObjectUrl=URL.createObjectURL(file);document.getElementById('pdfUploadArea').classList.add('hidden');document.getElementById('pdfReader').classList.remove('hidden');document.getElementById('pdfFrame').src=pdfObjectUrl;document.getElementById('pdfFileName').textContent=file.name;try{document.getElementById('pdfNotes').value=localStorage.getItem('mosaic-pdf-note')||''}catch(e){}showToast('PDF opened in this browser')}
function exportMotion(){const txt=esc(motionSettings.text||'Make a little magic.');const html=`<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic motion preview</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171a17;font-family:system-ui,sans-serif}.stage{width:min(90vw,700px);aspect-ratio:16/9;border-radius:24px;background:linear-gradient(135deg,${motionSettings.background},#596745);display:grid;place-items:center;overflow:hidden}.title{max-width:80%;color:${motionSettings.color};font-size:clamp(28px,7vw,66px);font-weight:850;letter-spacing:-.06em;text-align:center;animation:${motionSettings.animation==='pulse'?'pulse 1.7s ease-in-out infinite':motionSettings.animation==='slide'?'slide 1.8s ease-in-out infinite':motionSettings.animation==='bounce'?'bounce 1.6s ease-in-out infinite':motionSettings.animation==='still'?'none':'float 3s ease-in-out infinite'}}@keyframes float{50%{transform:translateY(-14px) rotate(2deg)}}@keyframes pulse{50%{transform:scale(1.05);opacity:.82}}@keyframes slide{50%{transform:translateX(15px);opacity:.8}}@keyframes bounce{35%{transform:translateY(-22px)}55%{transform:translateY(0)}}</style><div class="stage"><div class="title">${txt}</div></div></html>`;downloadBlob(new Blob([html],{type:'text/html'}),safeName(motionSettings.text)+'.html')}
function exportLayout(){const svg=document.getElementById('layoutSvg');if(!svg)return;const source=new XMLSerializer().serializeToString(svg);const blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'});downloadBlob(blob,'mosaic-poster.svg')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installButton')?.classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstall=null;showToast('Mosaic Studio installed')});
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}
renderHome();
